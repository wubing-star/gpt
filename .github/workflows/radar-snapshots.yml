name: TikTok Shop snapshot radar
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: tiktok-shop-radar
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read TikTok directly and save snapshots
        env:
          RADAR_SITE_TOKEN: ${{ secrets.RADAR_SITE_TOKEN }}
        run: node scripts/collect-cloud.mjs
